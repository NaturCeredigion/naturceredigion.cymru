<!doctype html>
<html lang="{{ .Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | Fixed Point Photography | {{ .Site.Title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://releases.transloadit.com/uppy/v4.13.2/uppy.min.css">
</head>
<body>
  <main class="container my-4">
    <div class="card mx-auto text-center" style="max-width: 750px">
      <div class="card-body">
        <h1>
          {{ with .Site.Params.logo }}
            <img class="img-fluid" src="{{ . | relURL }}" alt="{{ $.Site.Title }}" style="max-width: min(100%, 400px)">
          {{ else }}
            {{ .Site.Title }}
          {{ end }}
        </h1>
        <h2>Fixed Point Photography</h2>
        <p class="alert alert-info lead">
          Site name: <strong>{{ .Params.site_name }}</strong><br>
          Photography point: <strong>{{ .Params.point_name }}</strong>
        </p>
        <div id="uppy" data-site="{{ .Params.site_key }}" data-point="{{ .Params.point_key }}">
          <p role="status">Loading photo uploader…</p>
        </div>
        <noscript>Enable JavaScript to upload a photo.</noscript>
      </div>
    </div>
  </main>

  <script type="module">
    const target = document.getElementById('uppy');

    try {
      const { Uppy, Dashboard, XHRUpload, ImageEditor, GoldenRetriever, Compressor } =
        await import('https://releases.transloadit.com/uppy/v4.13.2/uppy.min.mjs');
      const { site, point } = target.dataset;
      const uploadFolder = `fpp/${site}/${point}/`;
      const aspectRatio = 4 / 3;
      const uppy = new Uppy({
        id: `uppy_${site}_${point}`,
        restrictions: {
          maxNumberOfFiles: 1,
          allowedFileTypes: ['image/*']
        }
      });

      target.replaceChildren();
      uppy.use(Dashboard, {
        target,
        height: 450,
        inline: true,
        locale: {
          strings: {
            browseFiles: 'Browse',
            dropPasteImportFiles: '%{browse} your device or take a photo now:'
          }
        },
        nativeCameraFacingMode: 'environment',
        showNativePhotoCameraButton: true
      });

      uppy.use(GoldenRetriever);
      uppy.use(ImageEditor, {
        actions: {
          revert: true,
          rotate: true,
          granularRotate: false,
          flip: false,
          zoomIn: false,
          zoomOut: false,
          cropSquare: false,
          cropWidescreen: false,
          cropWidescreenVertical: false
        },
        cropperOptions: {
          aspectRatio,
          zoomable: false
        }
      });
      uppy.use(Compressor, {
        width: 2048,
        height: 1536,
        quality: 0.8,
        resize: 'cover',
        locale: {
          strings: {
            compressingImages: 'Processing photo...',
            compressedX: 'Processing complete'
          }
        }
      });

      uppy.on('file-added', (file) => {
        const img = new Image();
        const previewUrl = URL.createObjectURL(file.data);
        img.onload = () => {
          URL.revokeObjectURL(previewUrl);
          const needsCrop = Math.abs(img.width / img.height - aspectRatio) > 0.01;
          if (needsCrop && uppy.getFile(file.id)) {
            const dashboard = uppy.getPlugin('Dashboard');
            dashboard.toggleFileCard(true, file.id);
            dashboard.openFileEditor(file);
          }
        };
        img.onerror = () => URL.revokeObjectURL(previewUrl);
        img.src = previewUrl;
      });

      uppy.on('upload', () => {
        uppy.setMeta({
          upload_preset: 'fpp_upload',
          asset_folder: uploadFolder,
          public_id: `${uploadFolder}${Date.now()}_${site}_${point}`
        });
      });

      uppy.use(XHRUpload, {
        endpoint: 'https://api.cloudinary.com/v1_1/naturceredigion/image/upload',
        fieldName: 'file',
        formData: true,
        allowedMetaFields: ['upload_preset', 'asset_folder', 'public_id']
      });
    } catch (error) {
      console.error(error);
      target.textContent = 'The photo uploader could not load. Refresh the page to try again.';
    }
  </script>
</body>
</html>
